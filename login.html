<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز العلمي - تسجيل الدخول</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #081B33;
            --card-bg: #0B2545;
            --primary: #00AEEF;
            --primary-hover: #008CBE;
            --danger: #FF4A4A;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
            --border-color: #1A365D;
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .login-logo {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 15px;
            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 174, 239, 0.2);
        }

        .input-wrapper i {
            color: var(--text-muted);
            margin-left: 10px;
        }

        .input-wrapper input {
            background: none;
            border: none;
            color: var(--text-main);
            width: 100%;
            padding: 12px 0;
            outline: none;
            font-size: 15px;
        }

        .error-message {
            color: var(--danger);
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: right;
            align-items: center;
            gap: 5px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #FFF;
            margin-bottom: 15px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin: 20px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider:not(:empty)::before { margin-left: .25em; }
        .divider:not(:empty)::after { margin-right: .25em; }

        .btn-bypass {
            background-color: rgba(255, 187, 51, 0.1);
            border: 1px dashed var(--warning);
            color: var(--warning);
        }

        .btn-bypass:hover {
            background-color: var(--warning);
            color: #000;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2 class="login-title">نظام الإدارة الإلكتروني</h2>
        <p class="login-subtitle">المركز العلمي للتدريب والتطوير</p>

        <form id="loginForm">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
            </div>

            <div class="error-message" id="errorMsg">
                <i class="fa-solid fa-circle-exclamation"></i> خطأ في اسم المستخدم أو كلمة المرور، يرجى المحاولة مرة أخرى.
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
            </button>
        </form>

        <div class="divider">بيئة التطوير المحلية</div>

        <button class="btn btn-bypass" onclick="bypassLogin()">
            <i class="fa-solid fa-bolt"></i> تخطي الحماية والدخول المباشر
        </button>
    </div>

    <script>
        // تنظيف التوكن القديم عند فتح صفحة اللوجن للتأكد من تصفير الحالة
        localStorage.removeItem('erp_token');

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');

            // التحقق من الحساب الافتراضي
            if (user === 'admin' && pass === 'admin123') {
                errorDiv.style.display = 'none';
                // تخزين توكن محاكي في المتصفح
                localStorage.setItem('erp_token', 'secure_mock_token_2026');
                // التوجه إلى لوحة التحكم الرئيسية (تأكدي من صحة مسار الملف لديكِ)
                window.location.replace('dashboard.html'); 
            } else {
                errorDiv.style.display = 'flex';
            }
        });

        // دالة التخطي السريع دون كتابة بيانات
        function bypassLogin() {
            localStorage.setItem('erp_token', 'bypass_development_token_active');
            window.location.replace('dashboard.html');
        }
    </script>
</body>
</html>
