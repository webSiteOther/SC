<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز العلمي - الملخص المالي</title>
    
    <!-- خطوط جوجل (تجوال) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- مكتبة الرسوم البيانية (Chart.js) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* =========================================
           لوحة الألوان الأساسية (Dark Theme)
           ========================================= */
        :root {
            --bg-color: #081B33;
            --card-bg: #0B2545;
            --primary: #00AEEF;
            --primary-hover: #008CBE;
            --success: #00C851;
            --warning: #FFBB33;
            --danger: #FF4A4A;
            --purple: #9C27B0;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
            --border-color: #1A365D;
            --input-bg: rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            padding-right: 260px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .page-container {
            padding: 30px;
        }

        /* ترويسة الصفحة */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i { color: var(--primary); }

        .header-actions { display: flex; gap: 10px; }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            border: none;
        }

        .btn-primary { background-color: var(--primary); color: #FFF; }
        .btn-primary:hover { background-color: var(--primary-hover); box-shadow: 0 4px 10px rgba(0, 174, 239, 0.3); }

        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--border-color); }

        /* =========================================
           لوحة الفلاتر (التاريخ)
           ========================================= */
        .controls-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 15px;
        }

        .filter-group i { color: var(--text-muted); margin-left: 10px; }

        .filter-group input {
            background: none; border: none; color: var(--text-main);
            outline: none; font-size: 14px; font-family: 'Tajawal';
        }

        .btn-filter {
            background-color: var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-filter:hover { background-color: var(--primary); color: #FFF; }

        /* =========================================
           مؤشرات الأداء المالية (الربح والخسارة)
           ========================================= */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        /* خطوط جانبية للألوان */
        .kpi-card.revenue::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 5px; background-color: var(--success); }
        .kpi-card.expense::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 5px; background-color: var(--danger); }
        .kpi-card.profit::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 5px; background-color: var(--primary); }

        .kpi-info h3 { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; }
        .kpi-info p { font-size: 32px; font-weight: 800; color: var(--text-main); }
        
        .kpi-icon {
            width: 60px; height: 60px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; color: #FFF;
        }

        .bg-green { background: linear-gradient(135deg, var(--success), #007E33); }
        .bg-red { background: linear-gradient(135deg, var(--danger), #CC0000); }
        .bg-blue { background: linear-gradient(135deg, var(--primary), #0056b3); }

        /* =========================================
           الرسوم البيانية (Charts Section)
           ========================================= */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .chart-header {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-container">
            
            <div class="page-header">
                <h1 class="page-title"><i class="fa-solid fa-chart-line"></i> الملخص المالي (الأرباح والخسائر)</h1>
                <div class="header-actions">
                    <button class="btn btn-outline" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة التقرير</button>
                    <button class="btn btn-primary"><i class="fa-solid fa-download"></i> تحميل كـ PDF</button>
                </div>
            </div>

            <!-- لوحة التحكم بالتاريخ (Date Filter) -->
            <div class="controls-panel">
                <span style="font-weight: bold; color: var(--text-muted); margin-left: 10px;">الفترة الزمنية:</span>
                
                <div class="filter-group">
                    <i class="fa-solid fa-calendar-days"></i>
                    <input type="date" id="startDate" title="من تاريخ">
                </div>
                
                <span style="color: var(--text-muted);">إلى</span>
                
                <div class="filter-group">
                    <i class="fa-solid fa-calendar-days"></i>
                    <input type="date" id="endDate" title="إلى تاريخ">
                </div>

                <button class="btn-filter" onclick="updateReport()"><i class="fa-solid fa-arrows-rotate"></i> تحديث التقرير</button>
            </div>

            <!-- مؤشرات الأداء (KPIs) -->
            <div class="kpi-grid">
                <div class="kpi-card revenue">
                    <div class="kpi-info">
                        <h3>إجمالي الإيرادات (المتحصلات)</h3>
                        <p id="totalRev">45,500 ج.م</p>
                    </div>
                    <div class="kpi-icon bg-green"><i class="fa-solid fa-arrow-trend-up"></i></div>
                </div>

                <div class="kpi-card expense">
                    <div class="kpi-info">
                        <h3>إجمالي المصروفات التشغيلية</h3>
                        <p id="totalExp">12,200 ج.م</p>
                    </div>
                    <div class="kpi-icon bg-red"><i class="fa-solid fa-arrow-trend-down"></i></div>
                </div>

                <div class="kpi-card profit">
                    <div class="kpi-info">
                        <h3>صافي الربح (Net Profit)</h3>
                        <p id="netProfit" style="color: var(--primary);">33,300 ج.م</p>
                    </div>
                    <div class="kpi-icon bg-blue"><i class="fa-solid fa-sack-dollar"></i></div>
                </div>
            </div>

            <!-- الرسوم البيانية -->
            <div class="charts-grid">
                <!-- الرسم البياني الشهري (Bar Chart) -->
                <div class="chart-container">
                    <div class="chart-header">حركة الإيرادات والمصروفات خلال العام (2026)</div>
                    <canvas id="cashflowChart" height="120"></canvas>
                </div>

                <!-- الرسم البياني الدائري للمصروفات (Doughnut Chart) -->
                <div class="chart-container">
                    <div class="chart-header">تحليل هيكل المصروفات</div>
                    <canvas id="expensesBreakdownChart" height="250"></canvas>
                </div>
            </div>

        </div>
    </main>

    <script>
        // حقن المكونات المشتركة
        if (!localStorage.getItem("erp_token")) window.location.replace("../login.html");

        Promise.all([
            fetch('../components/sidebar.html').then(res => res.text()),
            fetch('../components/navbar.html').then(res => res.text())
        ]).then(([sidebarData, navbarData]) => {
            document.getElementById('sidebar-container').innerHTML = sidebarData;
            Array.from(document.getElementById('sidebar-container').getElementsByTagName('script')).forEach(s => eval(s.innerText));
            
            document.getElementById('navbar-container').innerHTML = navbarData;
            Array.from(document.getElementById('navbar-container').getElementsByTagName('script')).forEach(s => eval(s.innerText));
        });

        // ضبط التواريخ الافتراضية (أول الشهر لآخره)
        window.addEventListener('DOMContentLoaded', () => {
            const date = new Date();
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
            const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
            
            document.getElementById('startDate').valueAsDate = firstDay;
            document.getElementById('endDate').valueAsDate = lastDay;

            // رسم الـ Charts
            initCharts();
        });

        // محاكاة زر تحديث التقرير
        function updateReport() {
            const btn = document.querySelector('.btn-filter');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحليل...';
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> تم التحديث';
                setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i> تحديث التقرير', 2000);
            }, 1000);
        }

        // ==========================================
        // إعداد الرسوم البيانية (Chart.js)
        // ==========================================
        function initCharts() {
            // 1. رسم حركة الإيرادات والمصروفات
            const ctxCashflow = document.getElementById('cashflowChart').getContext('2d');
            new Chart(ctxCashflow, {
                type: 'bar',
                data: {
                    labels: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'],
                    datasets: [
                        {
                            label: 'الإيرادات',
                            data: [35000, 38000, 42000, 40000, 45500, 25000],
                            backgroundColor: '#00C851', // Success Green
                            borderRadius: 6
                        },
                        {
                            label: 'المصروفات',
                            data: [10000, 11000, 10500, 12000, 12200, 8500],
                            backgroundColor: '#FF4A4A', // Danger Red
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { 
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#A0AEC0', font: { family: 'Tajawal' } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#A0AEC0', font: { family: 'Tajawal' } }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#FFFFFF', font: { family: 'Tajawal' } } }
                    }
                }
            });

            // 2. رسم تحليل المصروفات الدائري
            const ctxBreakdown = document.getElementById('expensesBreakdownChart').getContext('2d');
            new Chart(ctxBreakdown, {
                type: 'doughnut',
                data: {
                    labels: ['الإيجار', 'الرواتب والأجور', 'التسويق', 'المرافق', 'أخرى'],
                    datasets: [{
                        data: [5000, 4500, 1200, 850, 650],
                        backgroundColor: [
                            '#9C27B0', // Purple (Rent)
                            '#00AEEF', // Blue (Salaries)
                            '#FFBB33', // Warning (Marketing)
                            '#A0AEC0', // Gray (Utilities)
                            '#FF4A4A'  // Red (Other)
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#FFFFFF', font: { family: 'Tajawal' }, padding: 20 }
                        }
                    },
                    cutout: '70%'
                }
            });
        }
    </script>
</body>
</html>
