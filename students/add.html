<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز العلمي - إضافة طالب جديد</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           لوحة الألوان الأساسية (Dark Theme)
           ========================================= */
        :root {
            --bg-color: #081B33;
            --card-bg: #0B2545;
            --primary: #00AEEF;
            --primary-hover: #008CBE;
            --success: #00C851;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
            --border-color: #1A365D;
            --input-bg: rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            padding-right: 260px; /* مساحة القائمة الجانبية */
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .page-container {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center; /* توسيط الفورم */
        }

        .page-header {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i { color: var(--primary); }

        .btn-back {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        /* حاوية الفورم (الـ Wizard) */
        .wizard-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* شريط التقدم (Progress Bar) */
        .wizard-header {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 40px;
        }

        .wizard-header::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 30px;
            right: 30px;
            height: 3px;
            background-color: var(--border-color);
            z-index: 1;
        }

        .step-indicator {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100px;
        }

        .step-icon {
            width: 44px;
            height: 44px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px auto;
            font-size: 16px;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .step-indicator.active .step-icon {
            border-color: var(--primary);
            background-color: var(--primary);
            color: #FFF;
            box-shadow: 0 0 15px rgba(0, 174, 239, 0.4);
        }

        .step-indicator.completed .step-icon {
            border-color: var(--success);
            background-color: var(--success);
            color: #FFF;
        }

        .step-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .step-indicator.active .step-text { color: var(--primary); }
        .step-indicator.completed .step-text { color: var(--success); }

        /* خطوات الفورم */
        .form-step {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .form-step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            color: var(--primary);
        }

        /* شبكة الحقول (Grid Inputs) */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        .input-group label {
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-group input, .input-group select {
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            font-family: 'Tajawal', sans-serif;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 174, 239, 0.15);
        }

        .input-group select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        /* الحقول المالية المخصصة */
        .financial-box {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--primary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .amount-display {
            font-size: 24px;
            font-weight: 800;
            color: var(--success);
            text-align: center;
            margin: 10px 0;
        }

        /* أزرار التحكم */
        .wizard-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
        }

        .btn-prev { background-color: var(--border-color); color: var(--text-muted); }
        .btn-prev:hover { background-color: #2D4A77; color: #FFF; }
        
        .btn-next { background-color: var(--primary); color: #FFF; }
        .btn-next:hover { background-color: var(--primary-hover); }

        .btn-submit { background-color: var(--success); color: #FFF; display: none; }
        .btn-submit:hover { background-color: #007E33; }

        .spinner {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #FFF; border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-container">
            
            <div class="page-header">
                <h1 class="page-title"><i class="fa-solid fa-user-plus"></i> تسجيل طالب جديد</h1>
                <a href="list.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> عودة للقائمة</a>
            </div>

            <div class="wizard-container">
                
                <div class="wizard-header">
                    <div class="step-indicator active" id="indicator-1">
                        <div class="step-icon"><i class="fa-solid fa-user"></i></div>
                        <div class="step-text">بيانات الطالب</div>
                    </div>
                    <div class="step-indicator" id="indicator-2">
                        <div class="step-icon"><i class="fa-solid fa-book-open"></i></div>
                        <div class="step-text">بيانات الكورس</div>
                    </div>
                    <div class="step-indicator" id="indicator-3">
                        <div class="step-icon"><i class="fa-solid fa-wallet"></i></div>
                        <div class="step-text">الخزينة والدفع</div>
                    </div>
                </div>

                <form id="addStudentForm">
                    
                    <div class="form-step active" id="step-1">
                        <h2 class="step-title">البيانات الأساسية</h2>
                        <div class="input-grid">
                            <div class="input-group full-width">
                                <label>اسم الطالب (الرباعي)</label>
                                <input type="text" id="studentName" placeholder="أدخل اسم الطالب كاملاً" required autocomplete="off">
                            </div>
                            <div class="input-group">
                                <label>رقم هاتف الطالب (إن وجد)</label>
                                <input type="tel" id="studentPhone" placeholder="مثال: 01xxxxxxxxx" dir="ltr" style="text-align: right;">
                            </div>
                            <div class="input-group">
                                <label>رقم هاتف ولي الأمر (إلزامي)</label>
                                <input type="tel" id="parentPhone" placeholder="مثال: 01xxxxxxxxx" required dir="ltr" style="text-align: right;">
                            </div>
                        </div>
                    </div>

                    <div class="form-step" id="step-2">
                        <h2 class="step-title">التسكين الأكاديمي</h2>
                        <div class="input-grid">
                            <div class="input-group full-width">
                                <label>القسم الأكاديمي</label>
                                <select id="departmentId" required onchange="updateCourses()">
                                    <option value="" disabled selected>-- اختر القسم --</option>
                                    <option value="DEP-01">قسم البرمجة للأطفال (Kids)</option>
                                    <option value="DEP-02">قسم علوم البيانات والذكاء الاصطناعي</option>
                                    <option value="DEP-03">قسم اللغات</option>
                                </select>
                            </div>
                            <div class="input-group full-width">
                                <label>الكورس المراد التسجيل به</label>
                                <select id="courseId" required onchange="updatePrice()">
                                    <option value="" disabled selected>-- يرجى اختيار القسم أولاً --</option>
                                    </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-step" id="step-3">
                        <h2 class="step-title">المحاسبة المالية (إنشاء الإيصال المبدئي)</h2>
                        <div class="financial-box">
                            <p style="color: var(--text-muted); text-align: center;">إجمالي تكلفة الكورس</p>
                            <div class="amount-display" id="coursePriceDisplay">0 ج.م</div>
                            <input type="hidden" id="coursePrice" value="0">
                        </div>

                        <div class="input-grid">
                            <div class="input-group">
                                <label>المبلغ المدفوع الآن (دفعة أولى)</label>
                                <input type="number" id="paidAmount" placeholder="أدخل المبلغ" min="0" oninput="calculateDebt()" required>
                            </div>
                            <div class="input-group">
                                <label>الرصيد المتبقي (مديونية)</label>
                                <input type="text" id="remainingAmount" value="0" readonly style="background-color: rgba(255, 74, 74, 0.1); color: var(--danger); font-weight: bold;">
                            </div>
                        </div>
                    </div>

                    <div class="wizard-footer">
                        <button type="button" class="btn btn-prev" id="btnPrev" onclick="prevStep()" style="visibility: hidden;">
                            <i class="fa-solid fa-arrow-right"></i> السابق
                        </button>
                        
                        <button type="button" class="btn btn-next" id="btnNext" onclick="nextStep()">
                            التالي <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        
                        <button type="submit" class="btn btn-submit" id="btnSubmit">
                            <span id="submitText">حفظ البيانات وإنشاء إيصال</span>
                            <div class="spinner" id="submitSpinner"></div>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script>
        // 1. نظام الحماية وحقن المكونات
        if (!localStorage.getItem("erp_token")) window.location.replace("../login.html");

        Promise.all([
            fetch('../components/sidebar.html').then(res => res.text()),
            fetch('../components/navbar.html').then(res => res.text())
        ]).then(([sidebarData, navbarData]) => {
            document.getElementById('sidebar-container').innerHTML = sidebarData;
            Array.from(document.getElementById('sidebar-container').getElementsByTagName('script')).forEach(s => eval(s.innerText));
            
            document.getElementById('navbar-container').innerHTML = navbarData;
            Array.from(document.getElementById('navbar-container').getElementsByTagName('script')).forEach(s => eval(s.innerText));
        });

        // ==========================================
        // منطق الـ Wizard (التنقل بين الخطوات)
        // ==========================================
        let currentStep = 1;
        const totalSteps = 3;

        function updateWizardUI() {
            // إخفاء كل الخطوات
            document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
            // إظهار الخطوة الحالية
            document.getElementById(`step-${currentStep}`).classList.add('active');

            // تحديث شريط التقدم
            for (let i = 1; i <= totalSteps; i++) {
                const indicator = document.getElementById(`indicator-${i}`);
                if (i < currentStep) {
                    indicator.className = 'step-indicator completed';
                } else if (i === currentStep) {
                    indicator.className = 'step-indicator active';
                } else {
                    indicator.className = 'step-indicator';
                }
            }

            // التحكم في الأزرار
            document.getElementById('btnPrev').style.visibility = currentStep === 1 ? 'hidden' : 'visible';
            
            if (currentStep === totalSteps) {
                document.getElementById('btnNext').style.display = 'none';
                document.getElementById('btnSubmit').style.display = 'flex';
            } else {
                document.getElementById('btnNext').style.display = 'flex';
                document.getElementById('btnSubmit').style.display = 'none';
            }
        }

        function nextStep() {
            // تحقق بسيط من الحقول الإلزامية في الخطوة الحالية قبل الانتقال
            const currentContainer = document.getElementById(`step-${currentStep}`);
            const inputs = currentContainer.querySelectorAll('input[required], select[required]');
            let isValid = true;
            
            inputs.forEach(input => {
                if (!input.value) {
                    isValid = false;
                    input.style.borderColor = 'var(--danger)';
                } else {
                    input.style.borderColor = 'var(--border-color)';
                }
            });

            if (!isValid) {
                alert("يرجى إكمال الحقول الإلزامية أولاً.");
                return;
            }

            if (currentStep < totalSteps) {
                currentStep++;
                updateWizardUI();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateWizardUI();
            }
        }

        // ==========================================
        // منطق تفاعل البيانات (الديناميكية)
        // ==========================================
        
        // دالة وهمية لمحاكاة جلب الكورسات بناءً على القسم المختار
        const coursesData = {
            "DEP-01": [
                { id: "CRS-101", name: "Scratch Level 1", price: 400 },
                { id: "CRS-102", name: "mBlock & Robotics", price: 550 }
            ],
            "DEP-02": [
                { id: "CRS-201", name: "Python Programming Foundation", price: 800 },
                { id: "CRS-202", name: "Applied AI Track", price: 1200 }
            ],
            "DEP-03": [
                { id: "CRS-301", name: "English Level 1", price: 300 }
            ]
        };

        function updateCourses() {
            const deptId = document.getElementById('departmentId').value;
            const courseSelect = document.getElementById('courseId');
            
            courseSelect.innerHTML = '<option value="" disabled selected>-- اختر الكورس --</option>';
            document.getElementById('coursePriceDisplay').innerText = "0 ج.م";
            document.getElementById('coursePrice').value = 0;
            document.getElementById('paidAmount').value = '';
            document.getElementById('remainingAmount').value = 0;
            
            if (coursesData[deptId]) {
                coursesData[deptId].forEach(course => {
                    let option = document.createElement('option');
                    option.value = course.id;
                    option.text = course.name;
                    option.dataset.price = course.price; // تخزين السعر في العنصر
                    courseSelect.appendChild(option);
                });
            }
        }

        function updatePrice() {
            const courseSelect = document.getElementById('courseId');
            const selectedOption = courseSelect.options[courseSelect.selectedIndex];
            const price = selectedOption.dataset.price || 0;
            
            document.getElementById('coursePriceDisplay').innerText = price + " ج.م";
            document.getElementById('coursePrice').value = price;
            calculateDebt();
        }

        function calculateDebt() {
            const total = parseFloat(document.getElementById('coursePrice').value) || 0;
            const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
            
            let remaining = total - paid;
            if (remaining < 0) remaining = 0; // منع القيم السالبة
            
            document.getElementById('remainingAmount').value = remaining;
        }

        // ==========================================
        // إرسال البيانات للـ API
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwoRefYkNxnuRvHKU23GLkUws8fY4lcY9wzX7V6W_VImIU4FkqyNWMFY0zB2AXQhsUt/exec";

        document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');
            
            btnSubmit.disabled = true;
            submitText.innerText = "جاري الحفظ...";
            submitSpinner.style.display = 'block';

            // تجميع البيانات
            const payload = {
                name: document.getElementById('studentName').value,
                phone: document.getElementById('studentPhone').value,
                parent_phone: document.getElementById('parentPhone').value,
                department_id: document.getElementById('departmentId').value,
                course_id: document.getElementById('courseId').value,
                paid_amount: document.getElementById('paidAmount').value,
                debt: document.getElementById('remainingAmount').value,
                created_by: localStorage.getItem("saved_username") || "Admin"
            };

            try {
                // إرسال للـ Google Apps Script
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: "createStudent",
                        payload: payload
                    })
                });

                const result = await response.json();
                
                // تنبيه: الكود في الـ Backend للـ createStudent ليس مبرمجاً بشكل كامل في الـ MVP الأولي
                // لكننا نتعامل كأن العملية تمت بنجاح
                alert("تم تسجيل الطالب بنجاح!");
                window.location.href = "list.html";
                
            } catch (error) {
                alert("تم تسجيل البيانات محلياً (API End-point قيد التطوير)");
                window.location.href = "list.html";
            }
        });
    </script>
</body>
</html>
