<style>
    /* تنسيقات الشريط العلوي المعزولة */
    .navbar {
        height: 70px;
        background-color: #0B2545; /* متناسق مع القائمة الجانبية والـ Dark Mode */
        border-bottom: 1px solid #1A365D;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 30px;
        position: sticky;
        top: 0;
        z-index: 999;
    }

    /* مربع البحث */
    .nav-search {
        display: flex;
        align-items: center;
        background-color: rgba(0,0,0,0.2);
        border-radius: 8px;
        padding: 8px 15px;
        width: 300px;
        border: 1px solid #1A365D;
        transition: all 0.3s ease;
    }

    .nav-search:focus-within {
        border-color: #00AEEF;
        box-shadow: 0 0 8px rgba(0, 174, 239, 0.15);
    }

    .nav-search input {
        background: none;
        border: none;
        color: #FFFFFF;
        outline: none;
        width: 100%;
        margin-right: 10px;
        font-family: 'Tajawal', sans-serif;
        font-size: 14px;
    }

    .nav-search i {
        color: #A0AEC0;
    }

    /* منطقة الحساب والتنبيهات */
    .nav-profile {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    /* زر التنبيهات */
    .nav-icon-btn {
        position: relative;
        font-size: 20px;
        color: #A0AEC0;
        cursor: pointer;
        transition: 0.3s;
        background: none;
        border: none;
        padding: 5px;
    }

    .nav-icon-btn:hover {
        color: #00AEEF;
    }

    .nav-badge {
        position: absolute;
        top: -2px;
        right: -2px;
        background-color: #FF4A4A;
        color: white;
        font-size: 10px;
        font-weight: bold;
        border-radius: 50%;
        width: 16px;
        height: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid #0B2545;
    }

    /* بيانات المستخدم */
    .user-info {
        text-align: left; /* للمحاذاة بجوار الزر في واجهة RTL */
        line-height: 1.2;
        display: flex;
        flex-direction: column;
    }

    .user-name {
        font-size: 14px;
        font-weight: 800;
        color: #FFFFFF;
    }

    .user-role {
        font-size: 12px;
        color: #A0AEC0;
    }

    /* زر الخروج */
    .logout-btn {
        background-color: rgba(255, 74, 74, 0.1);
        color: #FF4A4A;
        border: 1px solid rgba(255, 74, 74, 0.3);
        padding: 8px 15px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-family: 'Tajawal', sans-serif;
        font-size: 13px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .logout-btn:hover {
        background-color: #FF4A4A;
        color: #FFF;
        box-shadow: 0 4px 10px rgba(255, 74, 74, 0.2);
    }
</style>

<nav class="navbar" id="mainNavbar">
    <div class="nav-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="ابحث عن طالب، إيصال، كورس...">
    </div>
    
    <div class="nav-profile">
        <button class="nav-icon-btn" title="التنبيهات">
            <i class="fa-regular fa-bell"></i>
            <span class="nav-badge">3</span>
        </button>
        
        <div class="user-info">
            <span class="user-name" id="navUserName">جاري التحميل...</span>
            <span class="user-role" id="navUserRole">...</span>
        </div>
        
        <button class="logout-btn" onclick="executeLogout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> خروج
        </button>
    </div>
</nav>

<script>
    // 1. تعيين بيانات المستخدم عند تحميل الشريط
    (function initializeNavbar() {
        // جلب البيانات من الـ Session
        const role = localStorage.getItem("erp_role") || "مستخدم";
        const savedUsername = localStorage.getItem("saved_username") || "مدير النظام"; 
        
        document.getElementById('navUserName').innerText = savedUsername;
        
        // ترجمة الصلاحية لشكل احترافي
        let displayRole = "مستخدم";
        if(role === 'admin') displayRole = "مدير النظام (Admin)";
        else if(role === 'accountant') displayRole = "المالية (Accountant)";
        else if(role === 'reception') displayRole = "الاستقبال (Reception)";
        else if(role === 'trainer') displayRole = "مدرب (Trainer)";

        document.getElementById('navUserRole').innerText = displayRole;
    })();

    // 2. دالة تسجيل الخروج الذكية
    function executeLogout() {
        if(confirm("هل أنت متأكد من تسجيل الخروج من النظام؟")) {
            // مسح التوكن من المتصفح
            localStorage.removeItem("erp_token");
            localStorage.removeItem("erp_role");
            
            // تحديد مسار التوجيه بناءً على عمق الصفحة الحالية
            // لو كنا في مجلد فرعي (مثل /students/list.html)، نرجع خطوة للخلف
            const currentPath = window.location.pathname;
            const inSubFolder = currentPath.split('/').length > 2 && !currentPath.endsWith('dashboard.html');
            
            window.location.replace(inSubFolder ? "../login.html" : "login.html");
        }
    }
</script>
