<script>
    // سكريبت ذكي لتحديد الصفحة الحالية وإضاءة الزر المناسب في القائمة الجانبية
    (function setActiveLink() {
        const currentPath = window.location.pathname;
        const links = document.querySelectorAll('#navLinks .menu-item');
        
        links.forEach(link => {
            const dataPath = link.getAttribute('data-path');
            // إذا كان مسار الصفحة الحالية يحتوي على اسم الـ module
            if (currentPath.includes(dataPath)) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    })();
</script>
