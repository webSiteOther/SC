<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز العلمي | تسجيل الدخول</title>
    <!-- استخدام خطوط جوجل (Tajawal) لتصميم عصري ومريح للعين -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1A43BF;
            --secondary-blue: #38B6FF;
            --dark-blue: #0F2C6E;
            --bg-dark: #0a1128; /* لون خلفية داكن هادئ جداً */
            --surface-dark: #121e3f; /* لون الكارد */
            --text-light: #ffffff;
            --text-muted: #a0aec0;
            --error-color: #ff4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* تأثيرات إضاءة هادئة في الخلفية */
        .glow-circle-1 {
            position: absolute;
            top: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-blue) 0%, transparent 70%);
            opacity: 0.15;
            filter: blur(50px);
        }

        .glow-circle-2 {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--secondary-blue) 0%, transparent 70%);
            opacity: 0.1;
            filter: blur(40px);
        }

        .login-container {
            background-color: var(--surface-dark);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container h1 {
            color: var(--secondary-blue);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo-container p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-light);
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 2px rgba(56, 182, 255, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 67, 191, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: var(--error-color);
            background-color: rgba(255, 74, 74, 0.1);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            display: none; /* مخفي افتراضياً */
        }

        /* Spinner Animation */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glow-circle-1"></div>
    <div class="glow-circle-2"></div>

    <div class="login-container">
        <div class="logo-container">
            <h1>المركز العلمي</h1>
            <p>نظام إدارة الموارد (ERP)</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" required autocomplete="off" placeholder="أدخل اسم المستخدم">
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">تسجيل الدخول</span>
            </button>
        </form>
    </div>

    <script>
        // دالة المزامنة والتحقق عند الضغط على زر الدخول
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة

            var usernameVal = document.getElementById('username').value.trim();
            var passwordVal = document.getElementById('password').value.trim();
            var errorDiv = document.getElementById('errorMessage');
            var btnText = document.getElementById('btnText');
            var spinner = document.getElementById('spinner');
            var loginBtn = document.getElementById('loginBtn');

            // إخفاء رسائل الخطأ السابقة
            errorDiv.style.display = 'none';

            // تشغيل الأنيميشن وتجميد الزر
            btnText.innerText = 'جاري التحقق...';
            spinner.style.display = 'inline-block';
            loginBtn.disabled = true;

            // إرسال البيانات للـ Apps Script (Backend)
            google.script.run
                .withSuccessHandler(function(response) {
                    // إرجاع الزر لحالته الطبيعية
                    btnText.innerText = 'تسجيل الدخول';
                    spinner.style.display = 'none';
                    loginBtn.disabled = false;

                    if(response.success) {
                        // المزامنة: حفظ بيانات المستخدم في التخزين المحلي (localStorage)
                        localStorage.setItem("userId", response.userId);
                        localStorage.setItem("role", response.role);
                        localStorage.setItem("floorId", response.floorId || "");
                        localStorage.setItem("fullName", response.fullName);

                        // توجيه المستخدم لصفحة الـ Dashboard (سنبرمجها لاحقاً)
                        // باستخدام بارامتر في الرابط ?page=dashboard
                        window.top.location.href = getUrlWithParams('dashboard'); 
                    } else {
                        // عرض رسالة الخطأ (بيانات خاطئة، حساب موقوف، الخ)
                        errorDiv.innerText = response.message;
                        errorDiv.style.display = 'block';
                    }
                })
                .withFailureHandler(function(error) {
                    btnText.innerText = 'تسجيل الدخول';
                    spinner.style.display = 'none';
                    loginBtn.disabled = false;
                    errorDiv.innerText = 'حدث خطأ في الاتصال بالسيرفر. يرجى المحاولة لاحقاً.';
                    errorDiv.style.display = 'block';
                })
                .processLogin(usernameVal, passwordVal); // استدعاء الدالة من Code.gs
        });

        // دالة مساعدة للحصول على الرابط الحالي وإضافة اسم الصفحة للتوجه إليها
        function getUrlWithParams(pageName) {
            var url = google.script.host.origin + google.script.host.pathname;
            return url + "?page=" + pageName;
        }
    </script>
</body>
</html>
