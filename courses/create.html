<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز العلمي - إضافة كورس جديد</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           لوحة الألوان الأساسية (Dark Theme)
           ========================================= */
        :root {
            --bg-color: #081B33;
            --card-bg: #0B2545;
            --primary: #00AEEF;
            --primary-hover: #008CBE;
            --success: #00C851;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
            --border-color: #1A365D;
            --input-bg: rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            padding-right: 260px; /* مساحة القائمة الجانبية */
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .page-container {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center; /* توسيط النموذج */
        }

        .page-header {
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title i { color: var(--primary); }

        .btn-back {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        /* حاوية نموذج الإدخال */
        .form-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* شبكة الحقول (Grid Inputs) */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        .input-group label {
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-group input, .input-group select, .input-group textarea {
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            font-family: 'Tajawal', sans-serif;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 174, 239, 0.15);
        }

        .input-group select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        /* أزرار الحفظ */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn-submit {
            background-color: var(--primary);
            color: #FFF;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 15px rgba(0, 174, 239, 0.3);
        }

        .btn-submit:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .spinner {
            display: none;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #FFF; border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-container">
            
            <div class="page-header">
                <h1 class="page-title" id="pageTitle"><i class="fa-solid fa-folder-plus"></i> إضافة كورس جديد</h1>
                <a href="list.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> عودة لقائمة الكورسات</a>
            </div>

            <div class="form-container">
                <form id="courseForm">
                    
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="courseName">اسم الكورس المعتمد</label>
                            <input type="text" id="courseName" placeholder="مثال: Python Programming Foundation" required autocomplete="off">
                        </div>

                        <div class="input-group">
                            <label for="departmentId">القسم الأكاديمي التابع له</label>
                            <select id="departmentId" required>
                                <option value="" disabled selected>-- حدد القسم --</option>
                                <option value="DEP-01">قسم البرمجة للأطفال</option>
                                <option value="DEP-02">قسم علوم البيانات والذكاء الاصطناعي</option>
                                <option value="DEP-03">قسم اللغات</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="coursePrice">تكلفة الكورس / المستوى (ج.م)</label>
                            <input type="number" id="coursePrice" placeholder="أدخل التكلفة" min="0" required>
                        </div>

                        <div class="input-group">
                            <label for="levelsCount">عدد المستويات المتاحة</label>
                            <input type="number" id="levelsCount" placeholder="مثال: 3" min="1" required>
                        </div>

                        <div class="input-group">
                            <label for="durationMonths">مدة الكورس المتوقعة (بالأشهر)</label>
                            <input type="number" id="durationMonths" placeholder="مثال: 3" min="1">
                        </div>

                        <div class="input-group full-width">
                            <label for="courseDescription">وصف تفصيلي للكورس (اختياري)</label>
                            <textarea id="courseDescription" placeholder="اكتب محتوى وأهداف الكورس هنا..."></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit" id="btnSubmit">
                            <span id="submitText">حفظ واعتماد الكورس</span>
                            <div class="spinner" id="submitSpinner"></div>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script>
        // 1. نظام الحماية وحقن المكونات
        if (!localStorage.getItem("erp_token")) window.location.replace("../login.html");

        Promise.all([
            fetch('../components/sidebar.html').then(res => res.text()),
            fetch('../components/navbar.html').then(res => res.text())
        ]).then(([sidebarData, navbarData]) => {
            document.getElementById('sidebar-container').innerHTML = sidebarData;
            Array.from(document.getElementById('sidebar-container').getElementsByTagName('script')).forEach(s => eval(s.innerText));
            
            document.getElementById('navbar-container').innerHTML = navbarData;
            Array.from(document.getElementById('navbar-container').getElementsByTagName('script')).forEach(s => eval(s.innerText));
        });

        // ==========================================
        // تهيئة الصفحة (وضع الإضافة أو التعديل)
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const editCourseId = urlParams.get('edit');
            
            if(editCourseId) {
                document.getElementById('pageTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> تعديل بيانات الكورس';
                document.getElementById('submitText').innerText = 'تحديث بيانات الكورس';
                
                // هنا سيتم جلب بيانات الكورس القديمة من הـ API لتعبئة الحقول
                // مثال وهمي:
                if(editCourseId === 'CRS-201') {
                    document.getElementById('courseName').value = 'Python Programming Foundation';
                    document.getElementById('departmentId').value = 'DEP-02';
                    document.getElementById('coursePrice').value = '800';
                    document.getElementById('levelsCount').value = '3';
                    document.getElementById('durationMonths').value = '3';
                }
            }
        });

        // ==========================================
        // إرسال البيانات للـ API
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwoRefYkNxnuRvHKU23GLkUws8fY4lcY9wzX7V6W_VImIU4FkqyNWMFY0zB2AXQhsUt/exec";

        document.getElementById('courseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');
            
            btnSubmit.disabled = true;
            submitText.innerText = "جاري الحفظ...";
            submitSpinner.style.display = 'block';

            // تجميع البيانات من النموذج
            const payload = {
                course_name: document.getElementById('courseName').value,
                department_id: document.getElementById('departmentId').value,
                price: document.getElementById('coursePrice').value,
                levels_count: document.getElementById('levelsCount').value,
                duration_months: document.getElementById('durationMonths').value,
                description: document.getElementById('courseDescription').value,
                created_by: localStorage.getItem("saved_username") || "Admin"
            };

            try {
                // إرسال البيانات للـ Backend (Google Apps Script)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: "createCourse", // سيتم برمجتها في الباك إند
                        payload: payload
                    })
                });

                const result = await response.json();
                
                // محاكاة النجاح لحين اكتمال الـ Backend
                setTimeout(() => {
                    alert("تم حفظ بيانات الكورس بنجاح!");
                    window.location.href = "list.html";
                }, 800);
                
            } catch (error) {
                setTimeout(() => {
                    alert("تم تسجيل الكورس (تنبيه: API قيد التطوير النهائي)");
                    window.location.href = "list.html";
                }, 800);
            }
        });
    </script>
</body>
</html>
